
<!DOCTYPE html> 
<html> 
<head> 
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <title>Quản lý sinh viên</title> 
    <link rel="stylesheet" type="text/css" href="style.css"> 
</head> 
<body> 
    <div class="container"> 
        <div class="header"> 
            <div> 
                <h1>Quản lý sinh viên</h1> 
                <p>Quản lý thông tin sinh viên</p> 
            </div> 
        </div> 
        <div class="card"> 
            <h2>Thông tin sinh viên</h2> 
            <div class="form"> 
                <div> 
                    <label>Mã sinh viên</label> 
                    <input type="text" id="nhap_masosinhvien" placeholder="DH52400001"> 
                </div> 
                <div> 
                    <label>Họ và tên</label> 
                    <input type="text" id="nhap_tensinhvien" placeholder="Nguyễn Văn A"> 
                </div> 
                <div> 
                    <label>Điểm GPA</label> 
                    <input type="number" id="nhap_diemgpa" placeholder="3.5" step="0.1"> 
                </div> 
            </div> 
            <div class="buttons"> 
                <button onclick="themsinhvien()"> Thêm </button> 
                <button onclick="suasinhvien()"> Sửa </button> 
                <button onclick="xoasinhvien()"> Xóa </button> 
                <button onclick="laythongtinsinhvien()"> Tìm kiếm </button> 
                <button onclick="hienluachonsapxep()"> Sắp xếp </button>
                <button onclick="laysinhvien()"> Làm mới </button> 
            </div> 
            <div id="luachonsapxep" style="display: none;">
                <button onclick="sapxep('ten')">Tên A → Z</button>
                <button onclick="sapxep('tengiam')">Tên Z → A</button>
                <button onclick="sapxep('diem')">GPA thấp → cao</button>
                <button onclick="sapxep('diemgiam')">GPA cao → thấp</button>
            </div>
            <div id="thongbao"></div> 
        </div> 
        <div class="card"> 
            <div class="result-header"> 
                <h2>Danh sách sinh viên</h2> 
            </div> 
            <table> 
                <thead> 
                    <tr> 
                        <th>STT</th> 
                        <th>MSSV</th> 
                        <th>Họ và tên</th> 
                        <th>GPA</th> 
                    </tr> 
                </thead> 
                <tbody id="danhsachsinhvien"> 
                </tbody> 
            </table> 
        </div> 
    </div> 
    <script src="web.js"></script> 
</body> 
</html>
